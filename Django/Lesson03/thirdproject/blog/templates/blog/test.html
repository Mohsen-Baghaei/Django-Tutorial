<!DOCTYPE html>
{% load blog_tags %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
</head>
<body>
    {% totalpost as pc %}
    {% posts as allposts %}
    <h1>
        total post count: {{pc}}
    </h1>
    {% for post in allposts %}
        <h1>    
            {{post.content|snippet}}
        </h1>
    {% endfor %}
</body>
</html>
